<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b3a"><title>中国邮政资费查询</title><link rel="stylesheet" href="./assets/style.css"></head><body><header><div class="brand"><div class="mark">邮</div><div><h1>中国邮政资费查询</h1><p>基于仓库结构化数据实时计算</p></div></div><span class="badge" id="version">读取数据中…</span></header><main><nav class="tabs"><button class="tab active" data-page="domestic">国内</button><button class="tab" data-page="international">国际 / 港澳台</button></nav><section id="domestic" class="page active"><div class="subtabs"><button class="subtab active" data-panel="dom-other">其他</button><button class="subtab" data-panel="dom-parcel">包裹</button></div><div id="dom-other" class="panel active"><div class="card"><h2>国内其他邮件</h2><div class="grid"><label>业务<select id="domMail"></select></label><label id="domLocalityWrap">本埠 / 外埠<select id="domLocality"><option value="LOCAL">本埠</option><option value="NON_LOCAL">外埠</option></select></label><label id="domWeightWrap">重量（克）<input id="domWeight" type="number" min="0.1" step="0.1" value="20"></label></div><button class="primary" id="calcDomestic">查询资费</button><div class="result" id="domResult"></div></div></div><div id="dom-parcel" class="panel"><div class="card"><h2>国内包裹</h2><div class="seg"><button class="method active" data-method="ordinary">邮政普通包裹</button><button class="method" data-method="hometown">家乡包裹贴</button></div><div id="ordinaryFields" class="grid"><label>起寄省<select id="parcelOrigin"></select></label><label>寄达省<select id="parcelDest"></select></label><label>重量（kg）<input id="parcelWeight" type="number" min="0.001" max="50" step="0.001" value="1"></label><label>优惠凭证<select id="parcelDiscount"><option value="">不使用优惠</option></select></label></div><div id="hometownFields" class="grid hidden"><label>重量（kg）<input id="hometownWeight" type="number" min="0.001" max="10" step="0.001" value="1"></label></div><button class="primary" id="calcParcel">查询资费</button><div class="result" id="parcelResult"></div></div></div></section><section id="international" class="page"><div class="card"><h2>国际 / 港澳台</h2><div class="seg"><button class="scope active" data-scope="international">国际</button><button class="scope" data-scope="hmt">港澳台</button></div><div id="intlFields" class="grid"><label>业务<select id="intlService"></select></label><label>目的地<select id="intlDest"></select></label><label id="intlWeightWrap">重量（克）<input id="intlWeight" type="number" min="0.1" step="0.1" value="20"></label></div><div id="hmtFields" class="grid hidden"><label>业务<select id="hmtMail"></select></label><label>目的地<select id="hmtDest"><option value="HK">香港</option><option value="MO">澳门</option><option value="TW">台湾</option></select></label><label id="hmtWeightWrap">重量（克）<input id="hmtWeight" type="number" min="0.1" step="0.1" value="20"></label></div><button class="primary" id="calcIntl">查询资费</button><div class="result" id="intlResult"></div></div></section><p class="foot">资费数据为整理数据，仅供查询参考；实际收寄与收费以中国邮政最新规定为准。</p></main><script src="./assets/path-fix.js"></script><script src="./assets/app.js"></script></body></html>
